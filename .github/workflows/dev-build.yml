name: Private Repo Auto Rebuild Payment Failed Handle
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: dev-build
  cancel-in-progress: false

permissions:
  contents: read

env:
  GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
  REPO: ${{ github.repository }}

jobs:
  build:
    name: Public, build, wait
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Make this repo public
        id: pub
        run: |
          [ -n "$GH_TOKEN" ] || { echo "::error::Add the SYNC_TOKEN secret"; exit 1; }
          for i in 1 2 3 4 5 6; do
            gh api -X PATCH "repos/$REPO" -F private=false --jq '"private=\(.private)"' || true
            sleep 5
            [ "$(gh api "repos/$REPO" --jq .private)" = false ] && break
            [ "$i" = 6 ] && { echo "::error::Could not make the repo public"; exit 1; }
          done
          # Any Build APK run that started before this moment ran while the repo was private
          echo "public_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Run Build APK until it succeeds
        env:
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          PUBLIC_AT: ${{ steps.pub.outputs.public_at }}
        run: |
          set -euo pipefail
          ID=""

          run_info() { # status conclusion attempt started updated
            gh api "repos/$REPO/actions/runs/$1" \
              --jq '"\(.status) \(.conclusion // "none") \(.run_attempt) \(.run_started_at // .created_at) \(.updated_at)"'
          }

          latest_for_sha() {
            gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=50" \
              --jq '[.workflow_runs[] | select(.name == "Build APK")] | sort_by(.created_at) | last | .id // empty'
          }

          wait_completed() { # run id, max seconds
            local end=$((SECONDS + $2)) st
            while [ "$SECONDS" -lt "$end" ]; do
              read -r st _ < <(run_info "$1") || st=""
              [ "$st" = completed ] && return 0
              sleep 10
            done
            return 1
          }

          dispatch_new() {
            local since; since=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            gh workflow run build-apk.yml --repo "$REPO" --ref "$BRANCH"
            ID=""
            for i in $(seq 1 30); do
              sleep 5
              ID=$(gh api "repos/$REPO/actions/runs?event=workflow_dispatch&branch=$BRANCH&created=>=$since" \
                --jq '.workflow_runs | map(select(.name == "Build APK")) | sort_by(.created_at) | last | .id // empty') || ID=""
              [ -n "$ID" ] && break
            done
            [ -n "$ID" ] || { echo "::error::Build run did not appear"; exit 1; }
            echo "Started new run $ID"
          }

          # Re-run $ID (stop it first if it is still running); start a new run when a re-run is not possible
          restart() {
            local st attempt now
            read -r st _ attempt _ < <(run_info "$ID")
            if [ "$st" != completed ]; then
              gh run cancel "$ID" --repo "$REPO" || true
              wait_completed "$ID" 180 || true
              read -r st _ attempt _ < <(run_info "$ID")
            fi
            if [ "$st" = completed ] && { gh run rerun "$ID" --failed --repo "$REPO" 2>/dev/null || gh run rerun "$ID" --repo "$REPO"; }; then
              for i in $(seq 1 30); do
                sleep 5
                now=$(gh api "repos/$REPO/actions/runs/$ID" --jq .run_attempt)
                [ "$now" -gt "$attempt" ] && return 0
              done
              return 0
            fi
            echo "Re-run not possible, starting a new run instead"
            dispatch_new
          }

          # Find the Build APK run for this exact commit (the push run may need a few seconds to appear)
          ID=$(latest_for_sha || true)
          if [ -z "$ID" ] && [ "$EVENT" = push ]; then
            echo "Waiting for the push run to appear"
            for i in $(seq 1 8); do
              sleep 5
              ID=$(latest_for_sha || true)
              [ -n "$ID" ] && break
            done
          fi

          if [ -z "$ID" ]; then
            dispatch_new
          else
            read -r st concl attempt started updated < <(run_info "$ID")
            stale=false
            [[ "$started" < "$PUBLIC_AT" ]] && stale=true
            echo "Existing run $ID: status=$st conclusion=$concl attempt=$attempt started=$started stale=$stale"
            if [ "$st" != completed ]; then
              if [ "$stale" = true ]; then
                echo "It started while the repo was still private (billing fails there), restarting it"
                restart
              else
                echo "Already running, waiting for it"
              fi
            elif [ "$concl" = success ]; then
              if [ "$EVENT" = push ]; then
                echo "Same commit already built successfully, nothing to do"
                exit 0
              fi
              dispatch_new
            else
              echo "Same commit finished as $concl, re-running"
              restart
            fi
          fi

          # Wait for it; a run that dies within 3 minutes is a billing or runner start-up problem, so retry it
          retries=0
          max_retries=2
          while true; do
            echo "Build run: https://github.com/$REPO/actions/runs/$ID"
            while true; do
              if ! read -r st concl attempt started updated < <(run_info "$ID"); then
                sleep 15
                continue
              fi
              echo "$(date -u +%T) $st $concl"
              [ "$st" = completed ] && break
              sleep 30
            done
            [ "$concl" = success ] && { echo "Build APK succeeded"; exit 0; }
            secs=$(( $(date -u -d "$updated" +%s) - $(date -u -d "$started" +%s) ))
            if [ "$secs" -lt 180 ] && [ "$retries" -lt "$max_retries" ]; then
              retries=$((retries + 1))
              echo "::warning::Build APK $concl after ${secs}s (billing or start-up problem), retry $retries of $max_retries"
              sleep 20
              restart
              continue
            fi
            echo "::error::Build APK finished: $concl"
            exit 1
          done

  make-private:
    name: Set repo back to private
    needs: build
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Wait while any Build APK run is still running
        run: |
          [ -n "$GH_TOKEN" ] || { echo "::error::SYNC_TOKEN missing"; exit 1; }
          # Going private mid-build would make that build fail on billing (any commit, not only this one)
          end=$((SECONDS + 5400))
          while [ "$SECONDS" -lt "$end" ]; do
            n=$(gh api "repos/$REPO/actions/runs?per_page=30" \
              --jq '[.workflow_runs[] | select(.name == "Build APK" and .status != "completed")] | length') || n=0
            [ "$n" = 0 ] && break
            echo "$(date -u +%T) $n Build APK run(s) still running, keeping the repo public"
            sleep 30
          done

      - name: Make this repo private
        run: |
          for i in 1 2 3 4 5; do
            gh api -X PATCH "repos/$REPO" -F private=true --jq '"private=\(.private)"' || true
            sleep 5
            [ "$(gh api "repos/$REPO" --jq .private)" = true ] && { echo "Repo is private again"; exit 0; }
          done
          echo "::error::Repo is still public"
          exit 1
