name: Resign old releases (SHA-1 v1)

on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Space-separated release tags to re-sign"
        required: true

permissions:
  contents: write

jobs:
  resign:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      ASSET: com.mounsokdara.video_player.apk
    steps:
      - name: Restore signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KS_B64" || { echo "ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/resign.jks"

      - name: Re-sign (v1 SHA-1 + v2 + v3), verify, upload
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TAGS: ${{ github.event.inputs.tags }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          mkdir -p work/original work/signed
          for TAG in $TAGS; do
            echo "::group::$TAG"
            mkdir -p "work/original/$TAG" "work/signed/$TAG"
            gh release download "$TAG" --pattern "$ASSET" --dir "work/original/$TAG" --clobber
            OLD="work/original/$TAG/$ASSET"; NEW="work/signed/$TAG/$ASSET"
            OLD_CERT="$("$APKSIGNER" verify --print-certs "$OLD" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')"
            echo "existing cert: $OLD_CERT"

            "$APKSIGNER" sign --ks "$RUNNER_TEMP/resign.jks" --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
              --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
              --min-sdk-version 17 --out "$NEW" "$OLD"

            REPORT="$("$APKSIGNER" verify --verbose --print-certs "$NEW")"
            echo "$REPORT" | grep -E "^Verifies|Verified using v[23]|certificate SHA-256"
            echo "$REPORT" | grep -qF "Verified using v2 scheme (APK Signature Scheme v2): true" || { echo "::error::$TAG missing v2"; exit 1; }
            echo "$REPORT" | grep -qF "Verified using v3 scheme (APK Signature Scheme v3): true" || { echo "::error::$TAG missing v3"; exit 1; }
            NEW_CERT="$(echo "$REPORT" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')"
            [ "$OLD_CERT" = "$NEW_CERT" ] || { echo "::error::$TAG certificate would change ($OLD_CERT -> $NEW_CERT)"; exit 1; }

            python3 - "$OLD" "$NEW" <<'PY'
          import sys, zipfile, hashlib
          old, new = zipfile.ZipFile(sys.argv[1]), zipfile.ZipFile(sys.argv[2])
          sig = lambda k: k.startswith("META-INF/") and (k.endswith((".SF", ".RSA", ".DSA", ".EC")) or k == "META-INF/MANIFEST.MF")
          h = lambda z: {k: hashlib.sha256(z.read(k)).hexdigest() for k in z.namelist() if not sig(k)}
          assert h(old) == h(new), "app contents changed"
          dg = new.read("META-INF/MANIFEST.MF").decode().splitlines()[3].split(":")[0]
          assert dg == "SHA1-Digest", "v1 digest is " + dg
          print("contents unchanged; v1 digest =", dg)
          PY

            gh release upload "$TAG" "$NEW" --clobber
            echo "::endgroup::"
          done

      - name: Keep originals as a backup artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sha1-run-original-apks-backup
          path: work/original
          if-no-files-found: ignore
          retention-days: 30
