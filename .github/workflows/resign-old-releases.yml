name: Resign old releases

on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Space-separated release tags to re-sign"
        required: true
        default: "v1.0.0_Indev v1.0.0_BETA v1.0.0_pre-Release v1.0.0 v1.0.1"

permissions:
  contents: write

jobs:
  resign:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      ASSET: com.mounsokdara.video_player.apk
    steps:
      - uses: actions/checkout@v4

      - name: Restore signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KS_B64" || { echo "ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/resign.jks"

      - name: Re-sign (v2 + v3) and verify
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TAGS: ${{ github.event.inputs.tags }}
        run: |
          set -euo pipefail
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          mkdir -p work/original work/signed
          for TAG in $TAGS; do
            echo "::group::$TAG"
            mkdir -p "work/original/$TAG" "work/signed/$TAG"
            gh release download "$TAG" --pattern "$ASSET" --dir "work/original/$TAG" --clobber
            OLD="work/original/$TAG/$ASSET"
            NEW="work/signed/$TAG/$ASSET"

            OLD_CERT="$("$APKSIGNER" verify --print-certs "$OLD" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')"
            echo "existing cert: $OLD_CERT"

            KS_FILE="$RUNNER_TEMP/resign.jks" bash scripts/sign-apk.sh "$OLD" "$NEW"

            NEW_CERT="$("$APKSIGNER" verify --print-certs "$NEW" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')"
            if [ "$OLD_CERT" != "$NEW_CERT" ]; then
              echo "::error::$TAG: certificate would change ($OLD_CERT -> $NEW_CERT); not uploading"
              exit 1
            fi

            gh release upload "$TAG" "$NEW" --clobber
            echo "::endgroup::"
          done

      - name: Keep originals as a backup artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-apks-backup
          path: work/original
          if-no-files-found: ignore
          retention-days: 30
