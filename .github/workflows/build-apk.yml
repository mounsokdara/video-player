name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/com.mounsokdara.video_player.apk
      - uses: actions/upload-artifact@v4
        with:
          name: video-player-apk
          path: build/app/outputs/flutter-apk/com.mounsokdara.video_player.apk
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Video Player v1.0.0
          files: build/app/outputs/flutter-apk/com.mounsokdara.video_player.apk
          fail_on_unmatched_files: true
          prerelease: false
          make_latest: true
          generate_release_notes: false
          body: |
            Video Player 1.0.0

            Library
            - Scan internal storage, SD cards, USB drives, and hidden files
            - Auto-refresh when files are added, changed, or deleted
            - Videos: hold a clip for actions; tap a thumbnail or row to open
            - Folders: hold for play queue, copy, cut, share, bookmark, pin, delete, properties
            - Rename only when a single item is selected
            - Paste is a bottom-right button and clears after one paste

            Player
            - libmpv playback (one video at a time)
            - Mini player scales to the screen, 16:9 or 9:16
            - HUD buttons only appear with the player controls
            - Background play with a notification; pause stays paused
            - Player style: bottom dialog sheet (default) or YouTube watch page (16:9 / 9:16, scroll-resize)
            - Dynamic color from the wallpaper; seed picker greys out while that is on
            - Equalizer, gestures, sleep timer, PIP, in-app mini player
            - Speed changes picture and sound together; pitch shift is optional

            Uninstall the previous APK before installing this one.
