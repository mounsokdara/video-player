name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Restore signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$KS_B64" || { echo "ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; }
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > android/app/upload-keystore.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' "$KS_PASS" "$KEY_PASS" "$KEY_ALIAS" > android/key.properties
          fi
      - name: Read version.txt
        id: ver
        run: echo "name=$(cut -d+ -f1 version.txt | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
      - run: flutter build apk --release --dart-define=APP_VERSION=${{ steps.ver.outputs.name }}
      - name: F-Droid check - no Google Play Core in APK
        run: |
          DEXDUMP=$(ls "$ANDROID_HOME"/build-tools/*/dexdump | sort -V | tail -1)
          rm -rf /tmp/dex && mkdir -p /tmp/dex
          unzip -q -o build/app/outputs/flutter-apk/app-release.apk 'classes*.dex' -d /tmp/dex
          found=0
          for f in /tmp/dex/classes*.dex; do
            "$DEXDUMP" "$f" | grep -oE "com/google/android/play/[A-Za-z0-9_/$]+" | sort -u | head -20 > /tmp/play.txt
            if [ -s /tmp/play.txt ]; then echo "$f:"; cat /tmp/play.txt; found=1; fi
          done
          [ "$found" -eq 0 ] || { echo "::error::Google Play Core references are still in the APK (F-Droid scanner would fail)"; exit 1; }
          echo "No com/google/android/play references in any dex"
      - name: Verify APK version matches version.txt
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          want_name=$(cut -d+ -f1 version.txt | tr -d '[:space:]')
          want_code=$(cut -d+ -f2 version.txt | tr -d '[:space:]')
          out=$("$AAPT" dump badging build/app/outputs/flutter-apk/app-release.apk | grep -m1 "^package:")
          echo "$out"
          echo "$out" | grep -q "versionName='$want_name'" && echo "$out" | grep -q "versionCode='$want_code'" || { echo "::error::APK version does not match version.txt ($want_name+$want_code)"; exit 1; }
      - name: Sign + verify APK (apksigner v1/v2/v3)
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          OUTDIR=build/app/outputs/flutter-apk
          KS_FILE=android/app/upload-keystore.jks bash scripts/sign-apk.sh "$OUTDIR/app-release.apk" "$OUTDIR/app-release-signed.apk"
          mv -f "$OUTDIR/app-release-signed.apk" "$OUTDIR/app-release.apk"
      - run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/com.mounsokdara.video_player.apk
      - uses: actions/upload-artifact@v4
        with:
          name: video-player-apk
          path: build/app/outputs/flutter-apk/com.mounsokdara.video_player.apk
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: Video Player v${{ steps.ver.outputs.name }}
          files: build/app/outputs/flutter-apk/com.mounsokdara.video_player.apk
          fail_on_unmatched_files: true
          prerelease: false
          make_latest: true
          generate_release_notes: false
          body: |
            # Changelog
            
            ## ${{ steps.ver.outputs.name }}
            
            Small change:
            - Added a better snackbar instead of the long, wide default snackbar.
            
            New features:
            - Floating preview overlay centered on thumb
            - Preview frames at real aspect ratio and screen density
            - JPEG quality 85
            - Last good preview frame fallback
            - More tab in bottom bar and side rail
            - Settings entry in More tab
            - Equalizer, Crash report and About entries
            - SettingsActivity in manifest
            - Large screen sidebar at 840 dp and up
            - 16:10 thumbnails
            - Up to 8 columns on wide screens
            - Wide header row for count filters and grid sort buttons
            - Launchable activity in each page instead of one main activity
            
            Fix (seek bar):
            - Thumb no longer flips between old and new positions during scrub
            - Thumb no longer snaps back after release
            - Preview no longer pushes seek bar and time labels around
            - Engine ignores stale mpv positions until playback settles within 1.2 seconds
            - Slider release and swipe seek use same immediate seek target
            - Seek now jumps to nearest keyframe
            
            Fix (preview):
            - Portrait video preview no longer shows pixelated landscape crop
            - Preview frames no longer blink when swapping
            - Preview box matches frame shape with no cropping
            
            Fix (mini player):
            - Stays clear of the bottom navigation bar on every device and system-bar style; the guessed nav height is gone and the real content area is used
            - Even 16 px margin on all sides, matching the page padding; side insets are no longer counted twice in landscape
            - Wide / landscape: stays in the content area and no longer parks over the navigation rail
            - Maximum size is calculated from the real area, and a crash on very short windows is fixed
            - Narrow card: the clipped title is dropped and the three buttons spread evenly; buttons are a little larger
            - No longer clips off left edge and overlaps grid
            - Expand chevron stays at content edge
            - No longer shows VIDEO LOG debug text
            
            Fix (nav bar):
            - System Nav bar only transparent on library and player when not fullscreen
            - Fullscreen video still hides bars
            - Nav bar contrast enforcement turned off in Dart and native
            - Contrast enforcement off for popups too
            - Android nav bar no longer draws opaque gray strip
            
            Fix (tablet layout):
            - Tablet grid uses real content width instead of whole screen width
            - Landscape tablet grid shows 4 columns instead of 3
            - Visible rows increase from about half a row to about 1.5 rows
            - Grid columns based on available content width
            - Wide content header shares one row
            
            Fix (UI):
            - Long press action sheet no longer cuts off in landscape
            - Bottom sheet no longer scrolls too far
            - Library tabs no longer scroll when there is nothing inside them
            - Better equalizer layout
            - Phones in portrait keep same two column cards
            - Page improvements
            
            Changed:
            - Settings tab replaced by More tab in bottom bar and side rail
            - Settings screen reloads changes after returning
