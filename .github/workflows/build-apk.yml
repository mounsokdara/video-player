name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/com.mounsokdara.video_player.apk
      - uses: actions/upload-artifact@v4
        with:
          name: video-player-apk
          path: build/app/outputs/flutter-apk/com.mounsokdara.video_player.apk
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0_pre-Release
          name: Video Player v1.0.0 pre-Release
          files: build/app/outputs/flutter-apk/com.mounsokdara.video_player.apk
          fail_on_unmatched_files: true
          prerelease: true
          make_latest: true
          generate_release_notes: false
          body: |
            Dynamic color greys out the seed picker. Only one video plays
            at a time; opening from Files or tapping twice replaces the old one.

            Uninstall the previous APK before installing this one.
