name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Restore signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$KS_B64" || { echo "ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; }
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > android/app/upload-keystore.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' "$KS_PASS" "$KEY_PASS" "$KEY_ALIAS" > android/key.properties
          fi
      - run: flutter build apk --release
      - name: Sign + verify APK (apksigner v1/v2/v3)
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          OUTDIR=build/app/outputs/flutter-apk
          KS_FILE=android/app/upload-keystore.jks bash scripts/sign-apk.sh "$OUTDIR/app-release.apk" "$OUTDIR/app-release-signed.apk"
          mv -f "$OUTDIR/app-release-signed.apk" "$OUTDIR/app-release.apk"
      - run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/com.mounsokdara.video_player.apk
      - uses: actions/upload-artifact@v4
        with:
          name: video-player-apk
          path: build/app/outputs/flutter-apk/com.mounsokdara.video_player.apk
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2.1
          name: Video Player v1.0.2.1
          files: build/app/outputs/flutter-apk/com.mounsokdara.video_player.apk
          fail_on_unmatched_files: true
          prerelease: false
          make_latest: true
          generate_release_notes: false
          body: |
            # Changelog

            ## 1.0.2.1

            Small change:
            - Added a better snackbar instead of the long, wide default snackbar.

            ## 1.0.2
            
            - Added HDR Render (not the best performing).
            - Added FFmpeg module.
            - Added more debug log toggles:
              - VideoLogOverlay: live yellow diagnostic text over the video.
              - Overlay: playback state: position, duration, play/pause, buffering, size, and FPS.
              - Overlay: media info: pixel format, transfer, primaries, matrix, and HDR detection.
              - Overlay: render info: render mode and active video filter.
              - Overlay: decoder info: hardware/software decoder information.
              - Overlay: timing / screen: display resolution and refresh rate.
              - Log player events: open, play, pause, seek, repeat, close, and tempo events.
              - Log gesture events: tap, seek, pinch, brightness, and volume gesture events.
              - Log lifecycle events: player/app background and resume transitions.
