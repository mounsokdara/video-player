name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: APK ${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # universal keeps the plain name com.mounsokdara.video_player.apk (the F-Droid repo downloads this one)
          - { id: universal,            platforms: "android-arm,android-arm64,android-x64", abis: "arm64-v8a armeabi-v7a x86_64" }
          - { id: arm64-v8a,            platforms: "android-arm64",                         abis: "arm64-v8a" }
          - { id: armeabi-v7a,          platforms: "android-arm",                           abis: "armeabi-v7a" }
          - { id: arm64-v8a_armeabi-v7a, platforms: "android-arm,android-arm64",            abis: "arm64-v8a armeabi-v7a" }
          - { id: x86_64,               platforms: "android-x64",                           abis: "x86_64" }
          # No 32-bit x86: Flutter rejects android-x86 for release builds (the build step exits with code 64).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Restore signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$KS_B64" || { echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$KS_B64" | base64 -d > android/app/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' "$KS_PASS" "$KEY_PASS" "$KEY_ALIAS" > android/key.properties
      - name: Build release APK (${{ matrix.platforms }})
        env:
          ABI_FILTER: ${{ matrix.abis }}
        run: |
          set +e
          VER=$(cut -d+ -f1 version.txt | tr -d '[:space:]')
          flutter build apk --release --target-platform "${{ matrix.platforms }}" --dart-define=APP_VERSION="$VER" 2>&1 | tee /tmp/build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            grep -n -E "^e: |error:|FAILURE|What went wrong|Execution failed|AAPT|not found|Unresolved|Could not|not supported" /tmp/build.log | head -15 | while IFS= read -r l; do echo "::error::${l:0:480}"; done
          fi
          exit $code
      - name: Only the expected CPU libraries are inside
        run: |
          got=$(unzip -Z1 build/app/outputs/flutter-apk/app-release.apk 'lib/*' | cut -d/ -f2 | sort -u | tr '\n' ' ')
          want=$(echo "${{ matrix.abis }}" | tr ' ' '\n' | sort -u | tr '\n' ' ')
          echo "libs: $got"
          [ "$got" = "$want" ] || { echo "::error::APK has [$got] but ${{ matrix.id }} must have [$want]"; exit 1; }
      - name: F-Droid check - no Google Play Core in APK
        run: |
          DEXDUMP=$(ls "$ANDROID_HOME"/build-tools/*/dexdump | sort -V | tail -1)
          rm -rf /tmp/dex && mkdir -p /tmp/dex
          unzip -q -o build/app/outputs/flutter-apk/app-release.apk 'classes*.dex' -d /tmp/dex
          found=0
          for f in /tmp/dex/classes*.dex; do
            "$DEXDUMP" "$f" | grep -oE "com/google/android/play/[A-Za-z0-9_/$]+" | sort -u | head -20 > /tmp/play.txt
            if [ -s /tmp/play.txt ]; then echo "$f:"; cat /tmp/play.txt; found=1; fi
          done
          [ "$found" -eq 0 ] || { echo "::error::Google Play Core references are still in the APK (F-Droid scanner would fail)"; exit 1; }
      - name: Verify APK version matches version.txt
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          want_name=$(cut -d+ -f1 version.txt | tr -d '[:space:]')
          want_code=$(cut -d+ -f2 version.txt | tr -d '[:space:]')
          out=$("$AAPT" dump badging build/app/outputs/flutter-apk/app-release.apk | grep -m1 "^package:")
          echo "$out"
          echo "$out" | grep -q "versionName='$want_name'" && echo "$out" | grep -q "versionCode='$want_code'" || { echo "::error::APK version does not match version.txt ($want_name+$want_code)"; exit 1; }
      - name: Sign + verify APK (apksigner v1/v2/v3)
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          OUTDIR=build/app/outputs/flutter-apk
          KS_FILE=android/app/upload-keystore.jks bash scripts/sign-apk.sh "$OUTDIR/app-release.apk" "$OUTDIR/app-release-signed.apk" | tee sign.log
          mv -f "$OUTDIR/app-release-signed.apk" "$OUTDIR/app-release.apk"
      - name: Name + size
        run: |
          mkdir -p dist
          if [ "${{ matrix.id }}" = "universal" ]; then N="com.mounsokdara.video_player.apk"; else N="com.mounsokdara.video_player-${{ matrix.id }}.apk"; fi
          cp build/app/outputs/flutter-apk/app-release.apk "dist/$N"
          echo "| ${{ matrix.id }} | \`$N\` | $(du -h "dist/$N" | cut -f1) |" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: video-player-${{ matrix.id }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

  # Reproducible per-ABI builds. These use EXACTLY the F-Droid recipe (same flags, FDROID=true, locked deps,
  # no ABI_FILTER) so F-Droid can rebuild them and publish this signed APK ("Binaries:" in fdroiddata).
  # File name: com.mounsokdara.video_player_<versionCode>.apk with versionCode = version.txt code * 10 + abi digit.
  build-fdroid:
    name: F-Droid ${{ matrix.abi }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # F-Droid builds here; absolute paths end up inside libapp.so, so CI must build at the same place.
      FD_APP: /home/vagrant/build/com.mounsokdara.video_player
      FD_FLUTTER: /home/vagrant/build/srclib/flutter
    strategy:
      fail-fast: false
      matrix:
        include:
          - { abi: armeabi-v7a, platform: android-arm,   digit: 1 }
          - { abi: arm64-v8a,   platform: android-arm64, digit: 2 }
          - { abi: x86_64,      platform: android-x64,   digit: 3 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"   # the F-Droid buildserver uses OpenJDK 21
      - name: Copy the source to the F-Droid build path
        run: |
          sudo mkdir -p /home/vagrant/build/srclib
          sudo chown -R "$USER" /home/vagrant
          rsync -a --exclude=.github "$GITHUB_WORKSPACE"/ "$FD_APP"/
      - name: Flutter SDK exactly like the F-Droid recipe (git checkout of the pinned version)
        run: |
          FV=$(sed -n -E 's/.*flutter-version:[[:space:]]*"?([0-9.]+).*/\1/p' .github/workflows/build-apk.yml | head -n1)
          [ -n "$FV" ]
          git clone --branch "$FV" --depth 1 https://github.com/flutter/flutter.git "$FD_FLUTTER"
          cd "$FD_APP"
          export PUB_CACHE="$FD_APP/.pub-cache"
          "$FD_FLUTTER/bin/flutter" config --no-analytics
          "$FD_FLUTTER/bin/flutter" pub get --enforce-lockfile
      - name: Build (identical to the F-Droid recipe, no signing key present)
        working-directory: /home/vagrant/build/com.mounsokdara.video_player
        run: |
          export PUB_CACHE="$FD_APP/.pub-cache"
          "$FD_FLUTTER/bin/flutter" build apk --release --split-per-abi --target-platform ${{ matrix.platform }} \
            --dart-define=FDROID=true --dart-define=APP_VERSION=$(cut -d+ -f1 version.txt)
      - name: Check versionCode and that no runner path leaked into the app
        working-directory: /home/vagrant/build/com.mounsokdara.video_player
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          base=$(cut -d+ -f2 version.txt | tr -d '[:space:]')
          want=$(( base * 10 + ${{ matrix.digit }} ))
          A=build/app/outputs/flutter-apk/app-${{ matrix.abi }}-release.apk
          out=$("$AAPT" dump badging "$A" | grep -m1 "^package:")
          echo "$out"
          echo "$out" | grep -q "versionCode='$want'" || { echo "::error::expected versionCode $want"; exit 1; }
          rm -rf /tmp/chk && mkdir /tmp/chk && unzip -q "$A" 'lib/*' -d /tmp/chk
          if strings -a /tmp/chk/lib/*/libapp.so | grep -q '/home/runner'; then echo "::error::runner path embedded in libapp.so"; exit 1; fi
          strings -a /tmp/chk/lib/*/libapp.so | grep -m1 'dart_plugin_registrant' || true
      - name: Restore signing key (after the build, so the build itself never sees it)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KS_B64" || { echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$KS_B64" | base64 -d > /tmp/upload-keystore.jks
      - name: Sign + verify APK (apksigner v2/v3)
        working-directory: /home/vagrant/build/com.mounsokdara.video_player
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          D=build/app/outputs/flutter-apk; A=$D/app-${{ matrix.abi }}-release.apk
          KS_FILE=/tmp/upload-keystore.jks bash scripts/sign-apk.sh "$A" "$D/signed.apk"
          base=$(cut -d+ -f2 version.txt | tr -d '[:space:]')
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$D/signed.apk" "$GITHUB_WORKSPACE/dist/com.mounsokdara.video_player_$(( base * 10 + ${{ matrix.digit }} )).apk"
          rm -f /tmp/upload-keystore.jks
      - uses: actions/upload-artifact@v4
        with:
          name: video-player-fdroid-${{ matrix.abi }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [build-apk, build-fdroid]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: video-player-*
          path: dist
          merge-multiple: true
      - name: Version + release notes (automatic, with time snap)
        id: ver
        run: |
          echo "name=$(cut -d+ -f1 version.txt | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
          python3 scripts/changelog.py --release-notes release-notes.md
          ls -lh dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: Video Player v${{ steps.ver.outputs.name }}
          files: dist/*.apk
          fail_on_unmatched_files: true
          prerelease: false
          make_latest: true
          generate_release_notes: false
          body_path: release-notes.md
