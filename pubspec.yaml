name: video_player_app
description: Material 3 local video player for Android
publish_to: "none"
version: 1.0.1+2

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  video_player: ^2.10.0
  photo_manager: ^3.7.1
  permission_handler: ^12.0.1
  wakelock_plus: ^1.3.2
  screen_brightness: ^2.1.7
  volume_controller: ^3.4.0
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  share_plus: ^11.0.0
  dynamic_color: ^1.8.1
  battery_plus: ^6.2.2
  device_info_plus: ^11.5.0
  package_info_plus: ^8.3.1
  vibration: ^3.1.3
  sensors_plus: ^6.1.1
  file_picker: ^10.3.2
  url_launcher: ^6.3.2
  intl: ^0.20.2
  path: ^1.9.1
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
