name: video_player_app
description: Material 3 local video player for Android
publish_to: "none"
version: 1.0.1+2

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  photo_manager: ^3.7.1
  permission_handler: ^12.0.1
  wakelock_plus: ^1.3.2
  screen_brightness: ^2.1.7
  volume_controller: ^3.4.0
  shared_preferences: ^2.5.3
  share_plus: ^11.0.0
  dynamic_color: ^1.8.1
  battery_plus: ^6.2.2
  package_info_plus: ^8.3.1
  vibration: ^3.1.3
  url_launcher: ^6.3.2
  intl: ^0.20.2
  path: ^1.9.1

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
